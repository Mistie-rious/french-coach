<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Français{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
  {% if not hide_nav %}
  <nav class="tabbar">
    <a href="/" class="{{ 'on' if request.url.path == '/' }}"><span>☀︎</span>Today</a>
    <a href="/review" class="{{ 'on' if request.url.path.startswith('/review') }}"><span>↻</span>Review</a>
    <a href="/read" class="{{ 'on' if request.url.path.startswith('/read') }}"><span>📖</span>Read</a>
    <a href="/write" class="{{ 'on' if request.url.path.startswith('/write') }}"><span>✎</span>Write</a>
    <a href="/stats" class="{{ 'on' if request.url.path.startswith('/stats') }}"><span>▤</span>Stats</a>
  </nav>
  {% endif %}
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
    // Disable submit buttons while a slow POST (generation/correction) runs.
    document.addEventListener("submit", (e) => {
      const b = e.target.querySelector("button[data-busy]");
      if (b) { b.disabled = true; b.textContent = b.dataset.busy; }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
