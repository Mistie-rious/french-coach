# Rename `app` to something unique before `fly launch --copy-config --no-deploy`.
app = "french-coach"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "1gb"  # spaCy + app sits around 300-400 MB; 512mb is too tight
  cpu_kind = "shared"
  cpus = 1
