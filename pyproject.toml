[project]
name = "french-coach"
version = "0.1.0"
description = "Personal daily French coach (B1 → B2)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "fr-core-news-sm",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "spacy>=3.8.16",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
